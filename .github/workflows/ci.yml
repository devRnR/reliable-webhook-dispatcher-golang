name: ci
on: [push, pull_request]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: webhook
          POSTGRES_PASSWORD: webhook
          POSTGRES_DB: webhook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U webhook"
          --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgres://webhook:webhook@localhost:5432/webhook?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: for f in migrations/*.up.sql; do psql "$INTEGRATION_DATABASE_URL" -f "$f"; done
      - run: go test -count=1 ./...
